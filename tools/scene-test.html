<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Scene test</title>
<style>html,body{margin:0;height:100%;background:#F5EDE1}#c{width:100vw;height:100vh;display:block}</style></head>
<body><div id="wrap" style="position:fixed;inset:0"><canvas id="c"></canvas></div>
<script src="../vendor/gsap/gsap.min.js"></script>
<script type="module">
  // Página de prueba aislada de la escena del hero (QA). Uso: ?p=0.5
  const base = new URL('../', location.href);
  document.head.insertAdjacentHTML('beforeend', `<base href="${base}">`);
  const { createHeroScene } = await import('../js/hero-scene.js');
  const s = await createHeroScene({ canvas: document.getElementById('c'), container: document.getElementById('wrap'), reducedMotion: true });
  window.scene = s;
  s.setProgress(parseFloat(new URLSearchParams(location.search).get('p') || '0'));
  window.__ready = true;
</script></body></html>
