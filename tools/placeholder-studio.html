import {
  THREE, PALETTE, makeRenderer, giftBox, tray, favorBox, CANDY, paper, speckleTexture,
} from './js/three/kit.js';

const RATIOS = { '16:9': 9 / 16, '16:10': 10 / 16, '4:5': 5 / 4, '1:1': 1, '3:2': 2 / 3 };
const W = 1600;

/* ----------------------------------------------------------- utilidades de escena */
function stage({ bg, ground = bg, ratio = '4:5', fov = 32, cam = [0, 3, 8], look = [0, 0.4, 0], light = [-6, 8, 4], intensity = 1, back = true, exposure = 1 }) {
  const canvas = document.getElementById('c');
  const H = Math.round(W * RATIOS[ratio]);
  const renderer = makeRenderer(canvas, { alpha: false, dprMax: 1, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.toneMappingExposure = exposure;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(bg);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.38 * intensity;

  const key = new THREE.DirectionalLight('#FFE6C4', 2.1 * intensity);
  key.position.set(...light);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 14;
  key.shadow.blurSamples = 24;
  key.shadow.bias = -0.0004;
  const sc = key.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 0.5; sc.far = 40;
  scene.add(key, new THREE.HemisphereLight('#FFF4E6', '#A8866E', 0.5 * intensity));
  const rim = new THREE.DirectionalLight('#FFD9C4', 0.55 * intensity);
  rim.position.set(6, 4, -6);
  scene.add(rim);

  // ciclorama: suelo que se curva hacia la pared, sin línea de horizonte
  const g = back ? cyclorama(ground) : new THREE.Mesh(new THREE.PlaneGeometry(80, 80), paper(ground, 0.92));
  if (!back) g.rotation.x = -Math.PI / 2;
  g.receiveShadow = true;
  scene.add(g);
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);
  camera.position.set(...cam);
  camera.lookAt(...look);
  return { renderer, scene, camera, key, rim, H, ground: g };
}

function cyclorama(color, { A = 26, R = 7, back = -9 } = {}) {
  const L = A + (Math.PI * R) / 2 + 30;
  const geo = new THREE.PlaneGeometry(80, L, 1, 160);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const s = pos.getY(i) + L / 2;
    let y, z;
    if (s < A) { z = back + A - s; y = 0; }
    else if (s < A + (Math.PI * R) / 2) { const t = (s - A) / R; z = back - R * Math.sin(t); y = R * (1 - Math.cos(t)); }
    else { z = back - R; y = R + (s - A - (Math.PI * R) / 2); }
    pos.setXYZ(i, pos.getX(i), y, z);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, paper(color, 0.94));
}

/** coloca un objeto apoyado en el suelo (y = 0) */
function put(scene, obj, x = 0, z = 0, { ry = 0, rx = 0, rz = 0, s = 1, y = null } = {}) {
  obj.scale.multiplyScalar(s);
  obj.rotation.set(rx, ry, rz);
  obj.position.set(x, 0, z);
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  obj.position.y = y !== null ? y : -box.min.y + 0.001;
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj);
  return obj;
}

const rb = (w, h, d, r = 0.04) => new THREE.RoundedBoxGeometry(w, h, d, 4, r);
const mesh = (geo, mat) => new THREE.Mesh(geo, mat);
const metal = () => new THREE.MeshStandardMaterial({ color: '#D9D6D2', metalness: 1, roughness: 0.22 });
const glass = () => new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.05, transmission: 0.92, thickness: 0.2, ior: 1.45 });
const glossyMat = (c, r = 0.25) => new THREE.MeshPhysicalMaterial({ color: c, roughness: r, clearcoat: 0.7, clearcoatRoughness: 0.2 });

function openBox(opts = {}, lid = -1.95) {
  const b = giftBox(opts);
  b.userData.lidPivot.rotation.x = lid;
  return b;
}
function stairs(b, spread = 1) {
  const H = b.userData.dims.H;
  const t = { cacao: tray('cacao'), fruit: tray('fruit'), classic: tray('classic') };
  t.cacao.position.set(0, H + 0.2 * spread, 1.2 * spread); t.cacao.rotation.x = -0.18;
  t.fruit.position.set(0, H + 1.15 * spread, 0.1 * spread); t.fruit.rotation.x = -0.2;
  t.classic.position.set(0, H + 2.1 * spread, -1.0 * spread); t.classic.rotation.x = -0.22;
  Object.values(t).forEach((x) => b.add(x));
  return t;
}
function sleeve(color) {
  const g = new THREE.Group();
  const s = mesh(rb(1.6, 0.55, 1.1, 0.03), paper(color, 0.8));
  const trayM = mesh(rb(1.5, 0.42, 1.0, 0.02), paper(PALETTE.nata, 0.85));
  trayM.position.set(0.85, -0.04, 0);
  g.add(s, trayM);
  const makers = [CANDY.lecheQuemada, CANDY.jamaica, CANDY.bombon, CANDY.mangoChile];
  for (let i = 0; i < 2; i++) {
    const c = makers[(i + (color === PALETTE.jamaica ? 1 : color === PALETTE.cacao ? 2 : 0)) % 4]();
    c.scale.multiplyScalar(0.3);
    c.position.set(1.2 + i * 0.36 - 0.18, 0.28, 0);
    g.add(c);
  }
  return g;
}
function wrapped(color = PALETTE.nata) {
  const g = new THREE.Group();
  g.add(mesh(rb(0.62, 0.42, 0.62, 0.05), paper(color, 0.55)));
  const st = mesh(new THREE.CircleGeometry(0.11, 32), paper(PALETTE.jamaica, 0.6));
  st.rotation.x = -Math.PI / 2; st.position.y = 0.212;
  g.add(st);
  return g;
}
function biteCube(color = '#C98B45', bite = true) {
  const s = new THREE.Shape();
  const r = 0.36;
  s.moveTo(0, 0); s.lineTo(1, 0);
  if (bite) {
    s.lineTo(1, 1 - r);
    s.absarc(1, 1, r, -Math.PI / 2, Math.PI, true);
  } else s.lineTo(1, 1);
  s.lineTo(0, 1); s.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.9, bevelEnabled: true, bevelSize: 0.07, bevelThickness: 0.07, bevelSegments: 6, curveSegments: 48 });
  geo.center();
  const map = speckleTexture('#C98B45', ['#F6EEDF', '#FFFFFF'], { density: 140, size: [0.5, 1.4], seed: 11 });
  map.repeat.set(1.2, 1.2);
  return mesh(geo, new THREE.MeshPhysicalMaterial({ color: '#ffffff', map, roughness: 0.34, clearcoat: 0.55, clearcoatRoughness: 0.3 }));
}

  },
  '21': () => {
    const S = stage({ bg: '#CDB7A0', ratio: '4:5', cam: [0, 2.6, 6.2], look: [0, 0.6, 0], fov: 30 });
    const g = new THREE.Group();
    const base = mesh(rb(3, 0.7, 1.8, 0.03), paper(PALETTE.jamaica, 0.75)); base.position.y = 0.35;
    const back = mesh(rb(3, 1.6, 0.08, 0.02), paper(PALETTE.jamaica, 0.75)); back.position.set(0, 0.8, -0.86);
    g.add(base, back);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) { const w = wrapped(); w.position.set(-1.05 + c * 0.7, 0.92, -0.35 + r * 0.7); g.add(w); }
    put(S.scene, g, 0, 0, { ry: -0.25 });
    const cup = mesh(new THREE.CylinderGeometry(0.3, 0.24, 0.5, 48), paper(PALETTE.azucar, 0.3)); put(S.scene, cup, 1.8, 1.4);
    return S;
  },
  '22': () => {
    const S = stage({ bg: '#EFE8DE', ratio: '3:2', cam: [-2, 3.2, 10], look: [0, 1.4, 0], fov: 30 });
    const stripe = [PALETTE.mango, PALETTE.jamaica, PALETTE.cacao];
    let k = 0;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3 - (y === 2 ? 1 : 0); x++) {
      const g = new THREE.Group();
      g.add(mesh(rb(1.9, 1.2, 1.5, 0.03), paper('#D6C2A4', 0.9)));
      const s = mesh(rb(1.92, 0.18, 1.52, 0.01), paper(stripe[k++ % 3], 0.8)); s.position.y = 0.2; g.add(s);
      put(S.scene, g, -2 + x * 1.96 + y * 0.6, 0, { y: 0.6 + y * 1.22, ry: (x - 1) * 0.03 });
    }
    return S;
  },
  '23': () => {
    const S = stage({ bg: PALETTE.arcilla, ratio: '16:9', cam: [0, 1.1, 6.5], look: [0, 0.7, 0], fov: 28, light: [-6, 3, 3] });
    const cols = [PALETTE.cacao, PALETTE.jamaica, PALETTE.mango, PALETTE.arcilla, PALETTE.nata, PALETTE.azucar];
    cols.forEach((c, i) => put(S.scene, mesh(rb(7, 0.2, 3, 0.02), paper(c, 0.92)), (i % 2) * 0.35 - 0.2, -i * 0.1, { y: 0.1 + i * 0.22, ry: (i % 3 - 1) * 0.03 }));
    return S;
  },
  '24': () => {
    const S = stage({ bg: PALETTE.piloncillo, ratio: '1:1', cam: [0, 0.9, 4.6], look: [0, 0.55, 0], fov: 30, light: [-5, 4, 4], intensity: 1.2 });
    put(S.scene, biteCube(), 0, 0, { ry: -0.18, s: 1.1 });
    return S;
  },
};

function label(canvas, id) {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d');
  g.drawImage(canvas, 0, 0);
  const txt = `DULCERA · RENDER PROVISIONAL · IMG-${id}`;
  g.font = '500 20px "DM Mono", monospace';
  const w = g.measureText(txt).width;
  g.fillStyle = 'rgba(42,26,20,0.55)';
  g.beginPath(); g.roundRect(c.width - w - 52, c.height - 58, w + 32, 34, 17); g.fill();
  g.fillStyle = '#F5EDE1';
  g.fillText(txt, c.width - w - 36, c.height - 35);
  return c;
}
function exportWebp(canvas, width) {
  const c = document.createElement('canvas');
  c.width = width; c.height = Math.round(canvas.height * (width / canvas.width));
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/webp', 0.86);
}

async function render(id) {
  const S = SHOTS[id]();
  const tasks = [];
  S.scene.traverse((o) => { const m = o.material; if (m && m.map && m.map.ready) tasks.push(m.map.ready); });
  await Promise.all(tasks);
  await document.fonts.load('500 20px "DM Mono"').catch(() => {});
  S.renderer.render(S.scene, S.camera);
  const labeled = label(S.renderer.domElement, id);
  return { full: exportWebp(labeled, 1600), small: exportWebp(labeled, 800) };
}

window.renderShot = render;
window.SHOT_IDS = Object.keys(SHOTS);
const q = new URLSearchParams(location.search).get('shot');
if (q) { const S = SHOTS[q](); S.renderer.render(S.scene, S.camera); }
window.__ready = true;
</script>
