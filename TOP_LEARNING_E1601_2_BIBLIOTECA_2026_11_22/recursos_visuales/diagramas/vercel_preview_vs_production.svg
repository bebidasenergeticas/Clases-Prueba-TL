<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">Vercel: despliegue de vista previa frente a producción</title>
<desc id="d">Flujo de un repositorio de GitHub conectado a Vercel. Un push a una rama de trabajo genera un despliegue de vista previa con una URL propia para probar. Un push o fusión a la rama de producción, normalmente main, genera el despliegue de producción en el dominio del proyecto. Las variables de entorno se configuran por entorno: Production, Preview y Development.</desc>
