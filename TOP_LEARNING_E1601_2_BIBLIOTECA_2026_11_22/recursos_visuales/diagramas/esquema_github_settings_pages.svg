<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d">
<title id="t">Esquema: activar GitHub Pages en Settings → Pages</title>
<desc id="d">Pantalla genérica de ajustes de un repositorio con menú lateral y la opción Pages resaltada. En el área principal, la sección Build and deployment con la fuente Deploy from a branch, selectores de rama y carpeta, botón Save y un aviso con la dirección donde queda publicado el sitio estático. Los números 1 a 6 se explican a la derecha. Ilustración esquemática; la interfaz puede variar.</desc>
