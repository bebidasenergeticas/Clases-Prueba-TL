<text x="200" y="350" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#2A2F45" text-anchor="start">https://‹usuario›.github.io/‹repositorio›/</text>
<text x="200" y="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5B627D" text-anchor="start">Puede tardar unos minutos en aparecer.</text>
<circle cx="496" cy="300" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="496" y="305" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="160" y="400" width="348" height="62" rx="8" fill="#FDEBD9" stroke="#B8500A" stroke-width="1.4"/>
<text x="172" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#7A3200" text-anchor="start">Pages sirve archivos estáticos. NO ejecuta Python ni</text>
<text x="172" y="435" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#7A3200" text-anchor="start">FastAPI y NO protege claves.</text>
<text x="544" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#43299F" text-anchor="start" letter-spacing="1">QUÉ HACER EN CADA PUNTO</text>
<circle cx="556" cy="62" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="67" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="576" y="62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Abre Pages</text>
<text x="576" y="80" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">En el repositorio entra a Settings</text>
<text x="576" y="96" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">y, en el menú lateral, a Pages.</text>
<circle cx="556" cy="128" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="133" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="576" y="128" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Fuente</text>
<text x="576" y="146" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Elige publicar desde una rama</text>
<text x="576" y="162" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">(Deploy from a branch).</text>
<circle cx="556" cy="194" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="199" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="576" y="194" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Rama</text>
<text x="576" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Normalmente la rama principal de</text>
<text x="576" y="228" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">tu proyecto.</text>
<circle cx="556" cy="260" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="265" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="576" y="260" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Carpeta</text>
<text x="576" y="278" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">La raíz del repositorio o la carpeta</text>
<text x="576" y="294" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">que contenga tu index.html.</text>
<circle cx="556" cy="326" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="331" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="576" y="326" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Guardar</text>
<text x="576" y="344" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Pulsa Save y espera a que termine</text>
<text x="576" y="360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">la publicación.</text>
<circle cx="556" cy="392" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="556" y="397" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="576" y="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">Tu enlace</text>
<text x="576" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Aparece la dirección pública.</text>
<text x="576" y="426" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Ábrela y comprueba que carga.</text>
