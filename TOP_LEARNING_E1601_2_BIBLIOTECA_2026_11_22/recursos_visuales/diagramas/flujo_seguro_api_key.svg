<text x="591" y="156.025" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0A7C78" text-anchor="middle">/api/chat</text>
<rect x="630" y="238" width="142" height="64" rx="10" fill="#0B1230"/>
<circle cx="647.8" cy="262.0" r="4.800000000000001" fill="none" stroke="#FF9A3C" stroke-width="2.2"/>
