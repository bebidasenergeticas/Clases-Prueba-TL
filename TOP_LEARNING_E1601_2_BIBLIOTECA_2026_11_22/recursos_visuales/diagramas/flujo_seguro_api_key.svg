<text x="672" y="266" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start">Variable de</text>
<text x="672" y="282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start">entorno</text>
<text x="642" y="296" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="start"></text>
<path d="M701.0 236.0 L701.0 207.0" fill="none" stroke="#FF9A3C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
