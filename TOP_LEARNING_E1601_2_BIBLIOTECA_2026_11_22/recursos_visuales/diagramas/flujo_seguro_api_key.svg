<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
<title id="t">Dónde guardar la API key: incorrecto frente a correcto</title>
<desc id="d">Dos paneles. A la izquierda, el camino incorrecto en rojo: la clave escrita en el código del frontend, pegada en un chat o prompt, o dentro de un archivo .env subido a un repositorio público; cualquiera puede leerla. A la derecha, el camino correcto en verde azulado: el navegador llama a tu backend, que lee la clave de una variable de entorno y es el único que habla con OpenRouter. Si una clave se expone, hay que revocarla y crear otra.</desc>
<rect x="0" y="0" width="800" height="560" fill="#FFFFFF"/>
<text x="16" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1230" text-anchor="start">¿Dónde vive la API key?</text>
<text x="16" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#454D6B" text-anchor="start">La regla no tiene excepciones: solo en el backend, solo en variables de entorno</text>
<rect x="12" y="70" width="382" height="400" rx="16" fill="#FCE9E7" stroke="#B3261E" stroke-width="2"/>
<rect x="12" y="70" width="382" height="42" rx="16" fill="#B3261E"/>
<rect x="12" y="96" width="382" height="16" rx="0" fill="#B3261E"/>
<circle cx="38" cy="91" r="11" fill="#FFFFFF"/>
<path d="M33.38 86.38 L42.62 95.62 M42.62 86.38 L33.38 95.62" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M32.5 85.5 L43.5 96.5 M43.5 85.5 L32.5 96.5" stroke="#B3261E" stroke-width="2.6" stroke-linecap="round"/>
<text x="60" y="98" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">INCORRECTO</text>
<rect x="28" y="130" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
<text x="42" y="154" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#B3261E" text-anchor="start">script.js</text>
<text x="42" y="175" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#171D33" text-anchor="start">const KEY = &quot;sk-or-…&quot;</text>
<text x="42" y="195" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#454D6B" text-anchor="start">Clave dentro del frontend</text>
<rect x="28" y="222" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
<text x="42" y="246" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#B3261E" text-anchor="start">Chat / prompt</text>
<text x="42" y="267" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#171D33" text-anchor="start">“Usa mi clave sk-or-…”</text>
<text x="42" y="287" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#454D6B" text-anchor="start">Clave pegada en un chat</text>
<rect x="28" y="314" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
<text x="42" y="338" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#B3261E" text-anchor="start">.env en GitHub</text>
<text x="42" y="359" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#171D33" text-anchor="start">OPENROUTER_API_KEY=…</text>
<text x="42" y="379" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#454D6B" text-anchor="start">Archivo secreto en el repositorio</text>
<rect x="28" y="408" width="350" height="50" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
<circle cx="52" cy="433" r="11" fill="#B3261E"/>
<text x="52" y="437.95" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="72" y="428.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7F1710" text-anchor="start">Cualquiera puede leerla: la verán otras</text>
<text x="72" y="444.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7F1710" text-anchor="start">personas, bots y registros públicos.</text>
<rect x="406" y="70" width="382" height="400" rx="16" fill="#DDF3F1" stroke="#0A7C78" stroke-width="2"/>
<rect x="406" y="70" width="382" height="42" rx="16" fill="#0A7C78"/>
