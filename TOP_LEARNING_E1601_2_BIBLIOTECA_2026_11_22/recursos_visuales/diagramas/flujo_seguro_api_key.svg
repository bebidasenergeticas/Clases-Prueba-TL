<text x="454" y="98" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">CORRECTO</text>
<rect x="424" y="134" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#0A7C78" stroke-width="1.8"/>
<rect x="434" y="148" width="30" height="24" rx="5" fill="#FFFFFF" stroke="#0A7C78" stroke-width="2.2"/>
<line x1="434" y1="154.72" x2="464" y2="154.72" stroke="#0A7C78" stroke-width="2" stroke-linecap="round"/>
<circle cx="440.0" cy="151.36" r="1.7" fill="#0A7C78"/>
<circle cx="446.5" cy="151.36" r="1.7" fill="#0A7C78"/>
<circle cx="453.0" cy="151.36" r="1.7" fill="#0A7C78"/>
<text x="472" y="165" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1230" text-anchor="start">Navegador</text>
<text x="436" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#454D6B" text-anchor="start">sin ninguna clave</text>
<rect x="630" y="134" width="142" height="70" rx="10" fill="#FFFFFF" stroke="#0A7C78" stroke-width="1.8"/>
<path d="M649.1 158.3 V154.4 A6.9 6.9 0 0 1 662.9 154.4 V158.3" fill="none" stroke="#0A7C78" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round"/>
