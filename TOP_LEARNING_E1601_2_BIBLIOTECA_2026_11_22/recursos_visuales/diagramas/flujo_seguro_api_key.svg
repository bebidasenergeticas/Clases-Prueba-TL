<text x="701" y="360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1230" text-anchor="middle">OpenRouter</text>
<text x="701" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#454D6B" text-anchor="middle">recibe la clave</text>
<path d="M701.0 302.0 L701.0 334.0" fill="none" stroke="#0A7C78" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="701.0,334.0 706.5,324.0 695.5,324.0" fill="#0A7C78"/>
<text x="424" y="252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#171D33" text-anchor="start">En local: archivo .env</text>
<text x="424" y="269" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#171D33" text-anchor="start">ignorado por Git (.gitignore).</text>
<text x="424" y="302" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#171D33" text-anchor="start">En la nube: Environment</text>
<text x="424" y="319" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#171D33" text-anchor="start">Variables del proyecto en la</text>
<text x="424" y="336" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#171D33" text-anchor="start">plataforma.</text>
<rect x="422" y="408" width="350" height="50" rx="10" fill="#FFFFFF" stroke="#0A7C78" stroke-width="1.6"/>
<circle cx="446" cy="433" r="11" fill="#0A7C78"/>
<path d="M440.5 433.22 L444.68 437.4 L451.72 428.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="466" y="428.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#06524F" text-anchor="start">El navegador nunca ve la clave; solo ve la</text>
<text x="466" y="444.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#06524F" text-anchor="start">respuesta del backend.</text>
<rect x="12" y="486" width="776" height="56" rx="12" fill="#0B1230"/>
<circle cx="40" cy="514" r="13" fill="#FF9A3C"/>
<text x="40" y="519.85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="64" y="508" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">¿Se expuso una clave? Revócala de inmediato en el panel del proveedor, crea otra y actualiza la variable de</text>
<text x="64" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">entorno. Borrar el mensaje no basta.</text>
