<rect x="655.3" y="164.9056" width="1.4000000000000001" height="4.3904000000000005" rx="1" fill="#FFFFFF"/>
<text x="678" y="164" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1230" text-anchor="start">Backend</text>
<text x="642" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#454D6B" text-anchor="start">único con la clave</text>
<path d="M554.0 169.0 L628.0 169.0" fill="none" stroke="#0A7C78" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="628.0,169.0 618.0,163.5 618.0,174.5" fill="#0A7C78"/>
