<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d">
<title id="t">Esquema: SQL Editor de Supabase</title>
<desc id="d">Pantalla genérica con barra lateral estrecha que incluye SQL Editor resaltado, pestaña de consulta nueva, área de edición con un comentario de ejemplo, botón Run y un panel de resultados inferior que muestra el mensaje de éxito o de error. Los números 1 a 5 se explican en la lista de la derecha. Ilustración esquemática; la interfaz puede variar.</desc>
