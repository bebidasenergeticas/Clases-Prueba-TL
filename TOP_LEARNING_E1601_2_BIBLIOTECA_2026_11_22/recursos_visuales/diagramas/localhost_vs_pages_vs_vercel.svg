<rect x="378" y="426" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="400" cy="454" r="11" fill="#0A7C78"/>
<path d="M394.5 454.22 L398.68 458.4 L405.72 449.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="459.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Landing o dashboard</text>
<text x="420" y="476.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">sin backend</text>
<rect x="586" y="426" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="608" cy="454" r="11" fill="#0A7C78"/>
