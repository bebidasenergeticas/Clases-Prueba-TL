<text x="628" y="476.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">seguro en línea</text>
<circle cx="30" cy="540" r="9" fill="#B8500A"/>
<text x="30" y="544.05" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="46" y="545" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#171D33" text-anchor="start">Un enlace publicado no garantiza una app que funcione de extremo a extremo: sin backend, el chat no responde.</text>
