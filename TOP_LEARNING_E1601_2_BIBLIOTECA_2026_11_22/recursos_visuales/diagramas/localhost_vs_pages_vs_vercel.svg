<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" width="800" height="566" role="img" aria-labelledby="t d">
<title id="t">Comparación: localhost, GitHub Pages y Vercel</title>
<desc id="d">Tabla visual de tres columnas. Localhost: solo tu computadora, ejecuta el backend mientras el servidor esté encendido, las claves viven en un archivo .env local. GitHub Pages: sitio estático público, no ejecuta Python ni FastAPI y no protege claves. Vercel: URL pública con despliegues de vista previa y producción, permite variables de entorno y funciones de servidor según la configuración del proyecto.</desc>
<rect x="0" y="0" width="800" height="566" fill="#FFFFFF"/>
<text x="16" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1230" text-anchor="start">¿Dónde vive tu proyecto?</text>
<text x="16" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#454D6B" text-anchor="start">Tres lugares, tres capacidades distintas</text>
<rect x="170" y="70" width="196" height="72" rx="12" fill="#5B3FD9"/>
<text x="268.0" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Localhost</text>
<text x="268.0" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#F2EFFF" text-anchor="middle">tu computadora</text>
<rect x="378" y="70" width="196" height="72" rx="12" fill="#B8500A"/>
<text x="476.0" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">GitHub Pages</text>
<text x="476.0" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#F2EFFF" text-anchor="middle">hosting estático</text>
<rect x="586" y="70" width="196" height="72" rx="12" fill="#0A7C78"/>
<text x="684.0" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Vercel</text>
<text x="684.0" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#F2EFFF" text-anchor="middle">despliegue en la nube</text>
<rect x="12" y="156" width="148" height="82" rx="10" fill="#F3EEE1"/>
<text x="24" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">¿Quién puede</text>
<text x="24" y="209" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">abrirlo?</text>
<rect x="170" y="156" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="192" cy="184" r="11" fill="#0A7C78"/>
<path d="M186.5 184.22 L190.68 188.4 L197.72 179.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="212" y="189.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Solo tú (mientras el</text>
<text x="212" y="206.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">servidor corre)</text>
<rect x="378" y="156" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="400" cy="184" r="11" fill="#0A7C78"/>
<path d="M394.5 184.22 L398.68 188.4 L405.72 179.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="189.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Cualquiera con el</text>
<text x="420" y="206.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">enlace (según tu</text>
<text x="420" y="224.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">configuración)</text>
<rect x="586" y="156" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="608" cy="184" r="11" fill="#0A7C78"/>
