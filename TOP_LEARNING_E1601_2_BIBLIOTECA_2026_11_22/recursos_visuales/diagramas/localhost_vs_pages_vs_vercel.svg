<text x="628" y="189.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Cualquiera con el</text>
<text x="628" y="206.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">enlace (según tu</text>
<text x="628" y="224.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">configuración)</text>
<rect x="12" y="246" width="148" height="82" rx="10" fill="#F3EEE1"/>
<text x="24" y="280" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">¿Ejecuta Python</text>
<text x="24" y="299" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">/ FastAPI?</text>
<rect x="170" y="246" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="192" cy="274" r="11" fill="#0A7C78"/>
<path d="M186.5 274.22 L190.68 278.4 L197.72 269.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="212" y="279.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Sí, en tu equipo</text>
<rect x="378" y="246" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="400" cy="274" r="11" fill="#B3261E"/>
<path d="M395.38 269.38 L404.62 278.62 M404.62 269.38 L395.38 278.62" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="279.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">No: solo archivos</text>
<text x="420" y="296.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">HTML, CSS y JS</text>
<rect x="586" y="246" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="608" cy="274" r="11" fill="#B8500A"/>
<text x="608" y="278.95" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="628" y="279.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Funciones de</text>
<text x="628" y="296.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">servidor; verifica</text>
<text x="628" y="314.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">compatibilidad</text>
<rect x="12" y="336" width="148" height="82" rx="10" fill="#F3EEE1"/>
<text x="24" y="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">¿Dónde va la API</text>
<text x="24" y="389" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">key?</text>
<rect x="170" y="336" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="192" cy="364" r="11" fill="#B8500A"/>
<text x="192" y="368.95" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="212" y="369.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Archivo .env local,</text>
<text x="212" y="386.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">fuera de Git</text>
<rect x="378" y="336" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="400" cy="364" r="11" fill="#B3261E"/>
<path d="M395.38 359.38 L404.62 368.62 M404.62 359.38 L395.38 368.62" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="369.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">En ningún lado: no</text>
<text x="420" y="386.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">protege secretos</text>
<rect x="586" y="336" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
<circle cx="608" cy="364" r="11" fill="#0A7C78"/>
<path d="M602.5 364.22 L606.68 368.4 L613.72 359.82" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="628" y="369.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">Variables de entorno</text>
<text x="628" y="386.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#171D33" text-anchor="start">del proyecto</text>
<rect x="12" y="426" width="148" height="82" rx="10" fill="#F3EEE1"/>
<text x="24" y="460" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1230" text-anchor="start">¿Para qué sirve?</text>
<rect x="170" y="426" width="196" height="82" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.5"/>
