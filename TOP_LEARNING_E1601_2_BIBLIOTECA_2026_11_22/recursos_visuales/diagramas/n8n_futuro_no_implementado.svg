<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d">
<title id="t">Arquitectura futura con n8n — no implementada en la práctica</title>
<desc id="d">Diagrama punteado y atenuado. La landing o el chat envía un evento a un webhook de n8n; el flujo de trabajo procesa con un modelo de lenguaje, guarda en una base de datos o una hoja y avisa por correo o mensajería. Está rotulado como arquitectura futura, no implementada en la práctica de la clase.</desc>
