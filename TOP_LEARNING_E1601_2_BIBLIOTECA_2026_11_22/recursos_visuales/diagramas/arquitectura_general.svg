<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
<title id="t">Arquitectura general: navegador, frontend, backend seguro, OpenRouter y Supabase</title>
<desc id="d">Diagrama de izquierda a derecha. En la zona pública están el navegador y el frontend (HTML, CSS y JavaScript). El frontend envía la petición POST /api/chat al backend seguro, que está en la zona privada con un candado y lee la API key de las variables de entorno. El backend llama a OpenRouter con la clave para obtener la respuesta del modelo y a Supabase para leer y guardar la memoria. La clave nunca llega al navegador ni a GitHub.</desc>
