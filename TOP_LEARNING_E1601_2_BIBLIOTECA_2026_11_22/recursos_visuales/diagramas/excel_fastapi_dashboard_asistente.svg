<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d">
<title id="t">Flujo local: Excel, FastAPI, dashboard y asistente</title>
<desc id="d">Cuatro pasos de izquierda a derecha. Un archivo Excel con datos simulados de Puerto A&amp;M se lee con FastAPI, que calcula los KPIs y los expone como endpoints. El dashboard los muestra con tarjetas y gráficas. El asistente responde preguntas usando esas cifras como contexto. Una nota aclara que el Excel vive en la computadora; en un despliegue público se necesita almacenamiento accesible en la nube.</desc>
<rect x="0" y="0" width="800" height="470" fill="#FFFFFF"/>
<text x="16" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1230" text-anchor="start">De Excel a dashboard con asistente</text>
<text x="16" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#454D6B" text-anchor="start">Nivel 1 · versión local · datos de Puerto A&amp;M (simulación académica)</text>
<rect x="16" y="90" width="150" height="190" rx="14" fill="#ECE8FB" stroke="#5B3FD9" stroke-width="2.2"/>
<circle cx="42" cy="118" r="14" fill="#5B3FD9"/>
<text x="42" y="123.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="66" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0B1230" text-anchor="start">Excel</text>
<text x="28" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">Archivo .xlsx con</text>
<text x="28" y="177.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">ventas, costos y</text>
<text x="28" y="195.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">pedidos simulados</text>
<rect x="222" y="90" width="150" height="190" rx="14" fill="#DDF3F1" stroke="#0A7C78" stroke-width="2.2"/>
<circle cx="248" cy="118" r="14" fill="#0A7C78"/>
<text x="248" y="123.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="272" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0B1230" text-anchor="start">FastAPI</text>
<text x="234" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">Lee el Excel, valida</text>
<text x="234" y="177.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">y calcula los KPIs</text>
<rect x="428" y="90" width="150" height="190" rx="14" fill="#FDEBD9" stroke="#B8500A" stroke-width="2.2"/>
<circle cx="454" cy="118" r="14" fill="#B8500A"/>
<text x="454" y="123.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="478" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0B1230" text-anchor="start">Dashboard</text>
<text x="440" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">Tarjetas y gráficas</text>
<text x="440" y="177.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">(Chart.js) en el</text>
<text x="440" y="195.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">navegador</text>
<rect x="634" y="90" width="150" height="190" rx="14" fill="#E4EEFB" stroke="#1F5FBF" stroke-width="2.2"/>
<circle cx="660" cy="118" r="14" fill="#1F5FBF"/>
<text x="660" y="123.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="684" y="124" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0B1230" text-anchor="start">Asistente</text>
<text x="646" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">Chat que responde</text>
<text x="646" y="177.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">con las cifras como</text>
<text x="646" y="195.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#171D33" text-anchor="start">contexto</text>
