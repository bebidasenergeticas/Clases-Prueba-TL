<text x="64" y="342" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#7A3200" text-anchor="start">Todo corre en TU computadora. Si apagas el equipo, el Excel y el servidor dejan de estar disponibles.</text>
