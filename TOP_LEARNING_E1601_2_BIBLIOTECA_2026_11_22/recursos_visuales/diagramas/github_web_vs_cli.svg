<path d="M34 501.0 A14.0 5.12 0 0 0 62 501.0" fill="none" stroke="#3DD9CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="500" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="start">Resultado: un repositorio con tu proyecto en GitHub</text>
<text x="78" y="521" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#D9D6EE" text-anchor="start">Los pasos exactos y capturas están en la guía 02. Nunca subas .env ni claves.</text>
