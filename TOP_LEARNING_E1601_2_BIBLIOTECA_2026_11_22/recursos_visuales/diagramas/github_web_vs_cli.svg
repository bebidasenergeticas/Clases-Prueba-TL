<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
<title id="t">GitHub: ruta web frente a GitHub CLI</title>
<desc id="d">Dos rutas hacia el mismo resultado, un repositorio en GitHub. Ruta A, web sin terminal: New repository, nombrar y crear, subir archivos con Upload files y confirmar con Commit changes. Ruta B, GitHub CLI en Windows: gh auth login, git init, git add, git commit y gh repo create o git push. Los pasos detallados están en la guía 02.</desc>
<rect x="0" y="0" width="800" height="560" fill="#FFFFFF"/>
<text x="16" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1230" text-anchor="start">Dos rutas, un mismo repositorio</text>
<text x="16" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#454D6B" text-anchor="start">Elige según tu comodidad; el resultado es el mismo</text>
<rect x="12" y="70" width="382" height="380" rx="16" fill="#ECE8FB" stroke="#5B3FD9" stroke-width="2"/>
<rect x="12" y="70" width="382" height="56" rx="16" fill="#5B3FD9"/>
<rect x="12" y="100" width="382" height="26" rx="0" fill="#5B3FD9"/>
<text x="30" y="96" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">RUTA A · GitHub WEB</text>
<text x="30" y="116" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#F2EFFF" text-anchor="start">Sin terminal · en el navegador</text>
<circle cx="50" cy="172" r="15" fill="#5B3FD9"/>
<text x="50" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="50" y1="188" x2="50" y2="232" stroke="#C9C1E8" stroke-width="2.2" stroke-linecap="round"/>
<rect x="78" y="142" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="92" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0B1230" text-anchor="start">New repository</text>
<text x="92" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Botón en la página principal de GitHub</text>
<circle cx="50" cy="246" r="15" fill="#5B3FD9"/>
<text x="50" y="252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="50" y1="262" x2="50" y2="306" stroke="#C9C1E8" stroke-width="2.2" stroke-linecap="round"/>
<rect x="78" y="216" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="92" y="242" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0B1230" text-anchor="start">Nombrar y crear</text>
<text x="92" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Nombre, público o privado, Create repository</text>
<circle cx="50" cy="320" r="15" fill="#5B3FD9"/>
<text x="50" y="326" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="50" y1="336" x2="50" y2="380" stroke="#C9C1E8" stroke-width="2.2" stroke-linecap="round"/>
<rect x="78" y="290" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="92" y="316" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0B1230" text-anchor="start">Upload files</text>
<text x="92" y="336" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Arrastra tus archivos a la página</text>
<circle cx="50" cy="394" r="15" fill="#5B3FD9"/>
<text x="50" y="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="78" y="364" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="92" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0B1230" text-anchor="start">Commit changes</text>
<text x="92" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Confirma el guardado</text>
<rect x="406" y="70" width="382" height="380" rx="16" fill="#DDF3F1" stroke="#0A7C78" stroke-width="2"/>
<rect x="406" y="70" width="382" height="56" rx="16" fill="#0A7C78"/>
<rect x="406" y="100" width="382" height="26" rx="0" fill="#0A7C78"/>
<text x="424" y="96" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">RUTA B · GitHub CLI</text>
<text x="424" y="116" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#F2EFFF" text-anchor="start">Terminal PowerShell en Windows</text>
<circle cx="444" cy="172" r="15" fill="#0A7C78"/>
<text x="444" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="444" y1="188" x2="444" y2="232" stroke="#9FD6D2" stroke-width="2.2" stroke-linecap="round"/>
<rect x="472" y="142" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="486" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">gh auth login</text>
<text x="486" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Inicia sesión desde la terminal</text>
<circle cx="444" cy="246" r="15" fill="#0A7C78"/>
<text x="444" y="252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="444" y1="262" x2="444" y2="306" stroke="#9FD6D2" stroke-width="2.2" stroke-linecap="round"/>
<rect x="472" y="216" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="486" y="242" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">git init</text>
<text x="486" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Prepara la carpeta como repositorio</text>
<circle cx="444" cy="320" r="15" fill="#0A7C78"/>
<text x="444" y="326" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="444" y1="336" x2="444" y2="380" stroke="#9FD6D2" stroke-width="2.2" stroke-linecap="round"/>
<rect x="472" y="290" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="486" y="316" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">git add . + git commit</text>
<text x="486" y="336" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Prepara y guarda una versión</text>
<circle cx="444" cy="394" r="15" fill="#0A7C78"/>
<text x="444" y="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="472" y="364" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#DDD6C5" stroke-width="1.4"/>
<text x="486" y="390" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#0B1230" text-anchor="start">gh repo create</text>
<text x="486" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#454D6B" text-anchor="start">Crea el repositorio remoto y sube</text>
<rect x="12" y="470" width="776" height="72" rx="14" fill="#0B1230"/>
<path d="M34 490.12 V511.88 A14.0 5.12 0 0 0 62 511.88 V490.12" fill="#0B1230" stroke="#3DD9CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
