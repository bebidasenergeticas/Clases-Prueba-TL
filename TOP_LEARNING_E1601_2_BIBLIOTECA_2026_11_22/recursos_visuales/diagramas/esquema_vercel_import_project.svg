<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-labelledby="t d">
<title id="t">Esquema: importar un proyecto desde GitHub en Vercel (Import project)</title>
<desc id="d">Dos paneles apilados. Arriba, el menú Add New con la opción Project y una lista de repositorios con un botón Import. Abajo, la pantalla de configuración con nombre del proyecto, framework preset, directorio raíz, variables de entorno y el botón Deploy. Los números 1 a 7 se explican en la lista de la derecha. Ilustración esquemática; la interfaz puede variar.</desc>
