<text x="64" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#2A2F45" text-anchor="start">▸ Environment Variables</text>
<text x="64" y="488" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#2A2F45" text-anchor="start">Key:  OPENROUTER_API_KEY</text>
<text x="64" y="508" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="500" fill="#5B627D" text-anchor="start">Value: ‹pégala solo aquí›</text>
<circle cx="492" cy="446" r="11.5" fill="#B8500A" stroke="#FFFFFF" stroke-width="2"/>
<text x="492" y="451" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
